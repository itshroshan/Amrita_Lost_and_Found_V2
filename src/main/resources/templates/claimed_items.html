<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Claimed Items</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="icon" th:href="@{/images/logo.png}" type="image/x-icon">
</head>
<body>

<div th:replace="~{navbar}"></div>
<script th:src="@{/js/theme.js}"></script>

<div class="dashboardd">
    <h2 class="navGap">Claimed Items</h2>

    <table class="tab" border="1" cellpadding="10">
        <tr>
            <th>Item</th>
            <th>Student Name</th>
            <th>Reg. Number</th>
            <th>Claimed At</th>
            <th>Image</th>
            <th>Action</th>
        </tr>

        <tr th:each="item : ${items}">
            <td th:text="${item.itemName}">Item Name</td>
            <td th:text="${item.studentName}">Student Name</td>
            <td th:text="${item.registrationNumber}">Registration Number</td>

            <td th:text="${#temporals.format(item.claimedAt, 'dd-MMM-yyyy HH:mm')}">Date</td>

            <td>
                <img
                    th:src="@{'/uploads/' + ${item.image}}"
                    class="item-image"
                    onclick="openImage(this.src)"
                >
            </td>
            <td>
                <a th:href="@{/delete-claimed-item/{id}(id=${item.id})}"
                class="btn btn-outline"
                onclick="return confirm('Are you sure you want to delete this claimed item report?');">
                Delete
                </a>
            </td>
        </tr>
    </table>

    <div class="back-center">
        <a th:href="@{/admin}" class="btn">Back to Dashboard</a>
    </div>
</div>

<div id="imageModal" class="image-modal" onclick="closeImage()">
    <span class="close-btn">&times;</span>
    <img id="modalImage">
</div>
<script th:src="@{/js/image_modal.js}"></script>

<div th:replace="~{footer}"></div>
<script th:src="@{/js/change.js}"></script>
</body>
</html>
