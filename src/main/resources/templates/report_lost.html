<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Report Lost Item</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="icon" th:href="@{/images/logo.png}" type="image/x-icon">
</head>
<body>

    <div th:replace="~{navbar}"></div>
<script th:src="@{/js/theme.js}"></script>

<h1 class="page-title navGap">Report Lost Item</h1>

<div class="form-wrapper">
    <form th:action="@{/report-lost}" method="post">

        <input type="text" name="itemName" placeholder="Item Name" required>
        <textarea name="description" placeholder="Item Description" required></textarea>
        <input type="text" name="location" placeholder="Last Seen Location" required>

        <div class="form-actions">
            <button type="submit" class="btn">Submit</button>
        </div>

        <div class="back-center">
            <a th:href="@{/student}" class="btn">Back to Dashboard</a>
        </div>

    </form>
</div>

<div th:replace="~{footer}"></div>
<script th:src="@{/js/change.js}"></script>

</body>
</html>
