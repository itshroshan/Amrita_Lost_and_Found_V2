<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Search Found Items</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="icon" th:href="@{/images/logo.png}" type="image/x-icon">
</head>
<body>

<div th:replace="~{navbar}"></div>

<h1 class="page-title navGap">Search Found Items</h1>

<div class="form-wrapper">
    <form th:action="@{/search}" method="get">
        <input type="text" name="query" placeholder="Search by item or location" th:value="${query}">

        <div class="form-actions">
            <button type="submit" class="btn">Search</button>
        </div>
    </form>
</div>

<p th:if="${query != null and query != '' and #lists.isEmpty(search_results)}" class="info-text">Item not found</p>

<div class="dashboard">
    <table class="tab">
        <tr>
            <th>Item Name</th>
            <th>Description</th>
            <th>Last Seen Location</th>
            <th>Image</th>
        </tr>

        <th:block th:if="${not #lists.isEmpty(search_results)}">
            <tr th:each="item : ${search_results}">
                <td th:text="${item.itemName}">Item Name</td>
                <td th:text="${item.description}">Description</td>
                <td th:text="${item.location}">Location</td>
                <td>
                    <img th:src="${item.image}" class="item-image" onclick="openImage(this.src)">
                </td>
            </tr>
        </th:block>

        <th:block th:unless="${not #lists.isEmpty(search_results)}">
            <tr th:each="item : ${all_items}">
                <td th:text="${item.itemName}">Item Name</td>
                <td th:text="${item.description}">Description</td>
                <td th:text="${item.location}">Location</td>
                <td>
                    <img th:src="${item.image}" class="item-image" onclick="openImage(this.src)">
                </td>
            </tr>
        </th:block>

    </table>

    <p style="text-align:center; margin-top:20px;">
        <div class="back-center">
            <a th:href="@{/student}" class="btn">Back to Dashboard</a>
        </div>
    </p>
</div>

<script th:src="@{/js/theme.js}"></script>

<div id="imageModal" class="image-modal" onclick="closeImage()">
    <span class="close-btn">&times;</span>
    <img id="modalImage">
</div>
<script th:src="@{/js/image_modal.js}"></script>

<div th:replace="~{footer}"></div>
<script th:src="@{/js/change.js}"></script>

</body>
</html>
