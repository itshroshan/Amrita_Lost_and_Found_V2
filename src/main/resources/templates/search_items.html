<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Search Found Items</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="icon" th:href="@{/images/logo.png}" type="image/x-icon">
</head>
<body>

<div th:replace="~{navbar}"></div>

<h1 class="page-title navGap">Search Found Items</h1>

<div class="form-wrapper">
    <form th:action="@{/search}" method="get">
        <input type="text" name="query" placeholder="Search by item or location" th:value="${query}">

        <div class="form-actions">
            <button type="submit" class="btn">Search</button>
        </div>
    </form>
</div>

<!-- Updated to use the new 'items' variable -->
<!-- Shows the error, but the table below will still successfully render all the fallback items! -->
<p th:if="${searchFailed}" class="info-text" style="text-align: center; color: #A91D3A; font-weight: bold; margin-bottom: 15px;">
    No items found matching "<span th:text="${query}"></span>". Showing all items instead.
</p>

<div class="dashboard">
    <table class="tab">
        <tr>
            <th>Item Name</th>
            <th>Description</th>
            <th>Last Seen Location</th>
            <th>Image</th>
        </tr>

        <!-- The single, clean loop for our paginated data -->
        <tr th:each="item : ${items}">
            <td th:text="${item.itemName}">Item Name</td>
            <td th:text="${item.description}">Description</td>
            <td th:text="${item.location}">Location</td>
            <td>
                <img th:src="${item.image}" class="item-image" onclick="openImage(this.src)">
            </td>
        </tr>
    </table>

    <!-- --- MODERN PAGINATION CONTROLS --- -->
    <div th:if="${totalPages > 1}" class="custom-pagination">

        <!-- Previous Arrow -->
        <a th:href="${currentPage > 0} ? @{/search(query=${query}, page=${currentPage - 1})} : '#'"
           class="page-link-item page-arrow"
           th:classappend="${currentPage == 0} ? 'disabled' : ''"
           title="Previous Page">
            &larr;
        </a>

        <!-- Page Numbers -->
        <a th:each="i : ${#numbers.sequence(1, totalPages)}"
           th:href="@{/search(query=${query}, page=${i - 1})}"
           class="page-link-item"
           th:classappend="${currentPage == (i - 1)} ? 'active' : ''"
           th:text="${i}">
        </a>

        <!-- Next Arrow -->
        <a th:href="${currentPage < totalPages - 1} ? @{/search(query=${query}, page=${currentPage + 1})} : '#'"
           class="page-link-item page-arrow"
           th:classappend="${currentPage == totalPages - 1} ? 'disabled' : ''"
           title="Next Page">
            &rarr;
        </a>

    </div>

    <p style="text-align:center; margin-top:20px;">
    <div class="back-center">
        <a th:href="@{/student}" class="btn">Back to Dashboard</a>
    </div>
    </p>
</div>

<script th:src="@{/js/theme.js}"></script>

<div id="imageModal" class="image-modal" onclick="closeImage()">
    <span class="close-btn">&times;</span>
    <img id="modalImage">
</div>
<script th:src="@{/js/image_modal.js}"></script>

<div th:replace="~{footer}"></div>
<script th:src="@{/js/change.js}"></script>

</body>
</html>
