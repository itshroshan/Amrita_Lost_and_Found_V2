<div class="navbar">
    <div class="navbar-left">
        <a href="#" onclick="window.location.reload(); return false;">
            <img th:src="@{/images/amrita_logo.jpg}" alt="Amrita Logo">
        </a>
        <div class="navbar-title">Amrita Lost & Found</div>
    </div>

    <div class="navbar-right">

        <button onclick="toggleDarkMode()" class="dark-toggle" id="darkToggle">
            🌙
        </button>

        <div th:if="${session.role != null}" class="profile-menu">
            <div class="profile-icon" onclick="toggleProfileMenu()">👤</div>

            <div class="profile-dropdown" id="profileDropdown">

                <a th:if="${session.role == 'admin'}" th:href="@{/admin}" class="dropdown-item">Home</a>
                <a th:if="${session.role == 'student'}" th:href="@{/student}" class="dropdown-item">Home</a>
                
                <div class="dropdown-divider"></div>
                <a th:href="@{/change-password}" class="dropdown-item">
                    Change Password
                </a>
                <div class="dropdown-divider"></div>
                <a th:href="@{/logout}" class="dropdown-item logout">
                    Logout
                </a>

            </div>

        </div>
        
        <a th:unless="${session.role != null}" th:href="@{/login}" class="login-link">Login</a>

    </div>
    <script th:src="@{/js/notifications.js}"></script>
</div>

<script th:src="@{/js/profile.js}"></script>
