<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Upload Found Item</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="icon" th:href="@{/images/logo.png}" type="image/x-icon">
</head>
<body>

    <div th:replace="~{navbar}"></div>
<script th:src="@{/js/theme.js}"></script>

<h1 class="page-title navGap">Upload Found Item</h1>

<div class="form-wrapper">
    <form th:action="@{/upload-item}" method="post" enctype="multipart/form-data">

        <input type="text" name="itemName" placeholder="Item Name" required>

        <textarea name="description" placeholder="Item Description" required></textarea>

        <input type="text" name="location" placeholder="Found Location" required>

        <input type="file" name="image" accept=".jpg, .jpeg, .png" required>
        
        <p th:if="${error != null}" class="info-text" style="color:#AF0C3E;" th:text="${error}"></p>

        <div class="form-actions">
            <button type="submit" class="btn">Upload Item</button>
        </div>
        
        <div class="back-center">
            <a th:href="@{/admin}" class="btn">Back to Dashboard</a>
        </div>

    </form>
</div>

<div th:replace="~{footer}"></div>
<script th:src="@{/js/change.js}"></script>
</body>
</html>
