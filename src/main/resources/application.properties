# ===============================
# APP CONFIGURATION
# ===============================
spring.application.name=lostandfound
server.address=0.0.0.0
server.port=8080

# ===============================
# DATABASE CONFIGURATION (SQLite)
# ===============================
spring.datasource.url=jdbc:sqlite:database.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Automatically update tables, but don't delete data
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in the console for debugging
spring.jpa.show-sql=true

# ===============================
# EMAIL CONFIGURATION (Gmail)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_ADDRESS}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# WEB & FILE UPLOAD CONFIGURATION
# ===============================
# Allow users to upload images up to 10MB in size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Turn off Thymeleaf cache so HTML changes show up instantly upon refresh
spring.thymeleaf.cache=false