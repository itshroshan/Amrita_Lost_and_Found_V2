# ===============================
# APP CONFIGURATION
# ===============================
spring.application.name=lostandfound
server.address=0.0.0.0
server.port=8080

# --- POSTGRESQL DATABASE CONFIGURATION ---
spring.datasource.url=jdbc:postgresql://ep-dawn-heart-ao4ocikc-pooler.c-2.ap-southeast-1.aws.neon.tech/neondb?user=neondb_owner&password=npg_knJjr34Sbxca&sslmode=require&channelBinding=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_knJjr34Sbxca

# Tell Hibernate to automatically create your tables if they don't exist
spring.jpa.hibernate.ddl-auto=update

# Optional: Show SQL queries in the terminal for debugging
spring.jpa.show-sql=true

# ===============================
# EMAIL CONFIGURATION (Gmail)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_ADDRESS}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- CLOUDINARY SECURE CONFIGURATION ---
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

server.tomcat.threads.max=10000
server.tomcat.max-connections=20000

# ===============================
# WEB & FILE UPLOAD CONFIGURATION
# ===============================
# Allow users to upload images up to 10MB in size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Hikari Connection Pool Settings for Serverless Neon ---
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.connection-timeout=20000

# Turn off Thymeleaf cache so HTML changes show up instantly upon refresh
spring.thymeleaf.cache=false